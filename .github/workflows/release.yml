name: Release

# Pushing a version tag (0.4.0 or v0.4.0) builds the mod and publishes a GitHub release with the jars.
# The release notes are the matching section of CHANGELOG.md, or GitHub's generated notes when there is none.
on:
  push:
    tags:
      - '[0-9]+.[0-9]+.[0-9]+*'
      - 'v[0-9]+.[0-9]+.[0-9]+*'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'

      - uses: gradle/actions/setup-gradle@v4

      - name: Version from tag
        run: echo "VERSION=${GITHUB_REF_NAME#v}" >> "$GITHUB_ENV"

      - name: Build and test
        run: |
          chmod +x gradlew
          ./gradlew --console=plain build

      - name: Release notes
        run: |
          awk -v v="$VERSION" '/^## /{p = ($2 == v); next} p' CHANGELOG.md > notes.md || true
          if [ -s notes.md ]; then echo "NOTES=--notes-file=notes.md" >> "$GITHUB_ENV"; else echo "NOTES=--generate-notes" >> "$GITHUB_ENV"; fi

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            "build/libs/fluxlite-${VERSION}.jar" \
            "build/libs/fluxlite-${VERSION}-dev.jar" \
            "build/libs/fluxlite-${VERSION}-sources.jar" \
            --title "FluxLite ${VERSION}" \
            --verify-tag \
            "$NOTES"
