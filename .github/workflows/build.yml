name: Build

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '25'

      - uses: gradle/actions/setup-gradle@v6

      - name: Build and test
        run: |
          chmod +x gradlew
          ./gradlew --console=plain build

      - name: Upload mod jar
        uses: actions/upload-artifact@v7
        with:
          name: fluxlite-${{ github.sha }}
          path: build/libs/*.jar
          if-no-files-found: error

      - name: Upload GUI previews
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: previews-${{ github.sha }}
          path: build/previews/
          if-no-files-found: ignore

      - name: Upload test reports
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: test-reports-${{ github.sha }}
          path: build/reports/tests/
          if-no-files-found: ignore
